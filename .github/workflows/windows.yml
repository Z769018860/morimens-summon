name: Windows portable EXE
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-build.txt
      - run: python build_exe.py
      - name: Verify packaged protocol and local history
        shell: pwsh
        run: |
          .\dist\MorimensSummon\MorimensSummon.exe --worker self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\MorimensSummon\MorimensSummon.exe --worker fetch-history --local-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/MorimensSummon -DestinationPath dist/MorimensSummon-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MorimensSummon-Windows
          path: dist/MorimensSummon-Windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/MorimensSummon-Windows.zip --title $env:GITHUB_REF_NAME --generate-notes
