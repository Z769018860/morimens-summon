name: Deploy preview to GitHub Pages

# Deploys web/ (the static homepage / analyzer / leaderboard / guide) so it can
# be previewed without running the local Python tool. Requires a one-time
# manual step in the repo: Settings → Pages → Build and deployment → Source
# = "GitHub Actions" (cannot be set from a workflow file).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the downloadable tool zip and place it alongside the site
        run: |
          python sync_skeydb_assets.py
          python build_release.py
          mkdir -p web/downloads
          cp dist/morimens-summon-tool.zip web/downloads/morimens-summon-tool.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
